apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-agent
  namespace: mlops-app
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-agent
  namespace: mlops-app
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlops-agent
