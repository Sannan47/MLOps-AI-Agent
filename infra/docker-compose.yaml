# Airflow 3 (LocalExecutor) + MLflow tracking server. UNVERIFIED until Docker is installed.
# Usage (from repo root): docker compose -f infra/docker-compose.yaml --env-file .env up -d --build
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: infra/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_USERNAME:-admin}:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-change-me-local-dev-only-0123456789}"
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_JWT_SECRET:-change-me-local-dev-only-0123456789}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    MLFLOW_TRACKING_URI: http://mlflow:5000
    PROJECT_DIR: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    AIRFLOW_USERNAME: "${AIRFLOW_USERNAME:-admin}"
    AIRFLOW_PASSWORD: "${AIRFLOW_PASSWORD}"
  volumes:
    - ../dags:/opt/airflow/dags
    - ..:/opt/airflow/project
    - ../dvc-storage:/opt/airflow/dvc-storage
    - airflow-auth:/opt/airflow/auth
    - airflow-logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --allowed-hosts "*" --cors-allowed-origins "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/auth
        echo "{\"$${AIRFLOW_USERNAME}\": \"$${AIRFLOW_PASSWORD}\"}" > /opt/airflow/auth/passwords.json
        airflow db migrate
    user: "0:0"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-data:
  mlflow-data:
  airflow-auth:
  airflow-logs:
